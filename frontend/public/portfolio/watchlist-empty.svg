<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glow-watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cyan-watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="orange-watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="shadow-watch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes float-screen {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-radar {
        0% { transform: scale(0.8); opacity: 0.8; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      @keyframes bell-ring {
        0%, 100% { transform: rotate(0deg); }
        20% { transform: rotate(15deg); }
        40% { transform: rotate(-15deg); }
        60% { transform: rotate(10deg); }
        80% { transform: rotate(-10deg); }
      }
      .anim-screen { animation: float-screen 4s ease-in-out infinite; transform-origin: center; }
      .anim-radar { animation: pulse-radar 2.5s ease-out infinite; transform-origin: 200px 135px; }
      .anim-bell { animation: bell-ring 3.5s ease-in-out infinite; transform-origin: top center; }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="145" r="115" fill="url(#bg-glow-watch)" />

  <!-- Radar Pulse Rings -->
  <circle cx="200" cy="135" r="50" stroke="#06b6d4" stroke-width="1.5" fill="none" className="anim-radar" />

  <!-- Main Floating Ticker Screen -->
  <g className="anim-screen" filter="url(#shadow-watch)">
    <rect x="115" y="70" width="170" height="150" rx="18" fill="#181825" stroke="#313244" stroke-width="2" />
    
    <!-- Screen Header -->
    <rect x="115" y="70" width="170" height="32" rx="18" fill="#2a2b3d" />
    <rect x="115" y="88" width="170" height="14" fill="#2a2b3d" />
    <text x="135" y="91" font-family="Arial, sans-serif" font-weight="extrabold" font-size="11" fill="#06b6d4">WATCHLIST &amp; ALERTS</text>

    <!-- Live Graph Line -->
    <path d="M 135 160 Q 155 130 175 150 T 215 125 T 265 140" stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="215" cy="125" r="5" fill="#f97316" />

    <!-- Ticker Row Cards -->
    <rect x="135" y="175" width="130" height="12" rx="6" fill="#2a2b3d" />
    <rect x="135" y="193" width="90" height="10" rx="5" fill="#2a2b3d" />
  </g>

  <!-- Side Floating Bell Alert -->
  <g className="anim-bell" transform="translate(280, 80)" filter="url(#shadow-watch)">
    <circle cx="20" cy="20" r="18" fill="url(#orange-watch)" />
    <!-- Bell Icon -->
    <path d="M 20 10 C 16 10 13 13 13 17 V 23 L 11 25 H 29 L 27 23 V 17 C 27 13 24 10 20 10 Z M 18 26 C 18 27.1 18.9 28 20 28 C 21.1 28 22 27.1 22 26" fill="#ffffff" />
  </g>

  <!-- Floating Magnifying Eye Icon -->
  <g className="anim-screen" transform="translate(80, 150)" filter="url(#shadow-watch)">
    <circle cx="18" cy="18" r="18" fill="url(#cyan-watch)" />
    <!-- Magnifier Icon -->
    <circle cx="16" cy="16" r="6" stroke="#ffffff" stroke-width="2" fill="none" />
    <line x1="20.5" y1="20.5" x2="25" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
