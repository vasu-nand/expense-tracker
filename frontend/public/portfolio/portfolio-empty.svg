<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <style>
      @keyframes float-main {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes float-coin1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-14px) scale(1.05); }
      }
      @keyframes float-coin2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-12deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dash-line {
        to { stroke-dashoffset: -40; }
      }
      @keyframes bar-grow {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.15); }
      }

      .animated-main { animation: float-main 5s ease-in-out infinite; transform-origin: center; }
      .animated-coin1 { animation: float-coin1 3.5s ease-in-out infinite; transform-origin: center; }
      .animated-coin2 { animation: float-coin2 4.2s ease-in-out infinite; transform-origin: center; }
      .animated-pulse { animation: pulse-glow 4s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 8 6; animation: dash-line 3s linear infinite; }
      .animated-bar1 { animation: bar-grow 4s ease-in-out infinite 0s; transform-origin: bottom; }
      .animated-bar2 { animation: bar-grow 4s ease-in-out infinite 0.5s; transform-origin: bottom; }
      .animated-bar3 { animation: bar-grow 4s ease-in-out infinite 1s; transform-origin: bottom; }
    </style>
  </defs>

  <circle cx="200" cy="150" r="120" fill="url(#bg-glow)" className="animated-pulse" />
  <circle cx="200" cy="150" r="105" stroke="url(#line-grad)" stroke-width="2" fill="none" className="animated-dash" />

  <g opacity="0.15">
    <line x1="80" y1="220" x2="320" y2="220" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="80" y1="170" x2="320" y2="170" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="80" y1="120" x2="320" y2="120" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <g className="animated-main" filter="url(#shadow)">
    <rect x="110" y="90" width="180" height="120" rx="20" fill="#1e1e2e" stroke="#313244" stroke-width="2" />
    <rect x="110" y="90" width="180" height="40" rx="20" fill="url(#card-grad)" />
    <rect x="110" y="110" width="180" height="20" fill="url(#card-grad)" />

    <rect x="130" y="104" width="24" height="18" rx="4" fill="#f59e0b" opacity="0.9" />
    <circle cx="142" cy="113" r="4" fill="#ffffff" opacity="0.6" />

    <g transform="translate(130, 185)">
      <rect x="0" y="-35" width="12" height="35" rx="3" fill="url(#emerald-grad)" className="animated-bar1" />
      <rect x="20" y="-22" width="12" height="22" rx="3" fill="url(#cyan-grad)" className="animated-bar2" />
      <rect x="40" y="-48" width="12" height="48" rx="3" fill="url(#card-grad)" className="animated-bar3" />
      <rect x="60" y="-30" width="12" height="30" rx="3" fill="url(#amber-grad)" className="animated-bar1" />
      <rect x="80" y="-55" width="12" height="55" rx="3" fill="url(#emerald-grad)" className="animated-bar3" />
    </g>

    <path d="M 230 160 L 255 135 M 255 135 H 238 M 255 135 V 152" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g className="animated-coin1" transform="translate(90, 75)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="18" fill="url(#amber-grad)" />
    <circle cx="20" cy="20" r="14" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.7" />
    <text x="20" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">₹</text>
  </g>

  <g className="animated-coin2" transform="translate(280, 160)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="16" fill="url(#emerald-grad)" />
    <circle cx="20" cy="20" r="12" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7" />
    <text x="20" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
