<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glow-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="purple-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cyan-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emerald-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow-analytics" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes float-analytics {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes pie-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bar-pulse1 {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.25); }
      }
      @keyframes bar-pulse2 {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.35); }
      }
      .anim-analytics { animation: float-analytics 4.5s ease-in-out infinite; transform-origin: center; }
      .anim-pie { animation: pie-rotate 15s linear infinite; transform-origin: 275px 115px; }
      .anim-b1 { animation: bar-pulse1 3.5s ease-in-out infinite 0s; transform-origin: bottom; }
      .anim-b2 { animation: bar-pulse2 3.5s ease-in-out infinite 0.4s; transform-origin: bottom; }
      .anim-b3 { animation: bar-pulse1 3.5s ease-in-out infinite 0.8s; transform-origin: bottom; }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="145" r="115" fill="url(#bg-glow-analytics)" />

  <!-- Main Floating Analytics Card -->
  <g className="anim-analytics" filter="url(#shadow-analytics)">
    <rect x="110" y="65" width="180" height="160" rx="18" fill="#181825" stroke="#313244" stroke-width="2" />
    
    <!-- Header -->
    <rect x="110" y="65" width="180" height="35" rx="18" fill="#2a2b3d" />
    <rect x="110" y="85" width="180" height="15" fill="#2a2b3d" />
    <text x="130" y="87" font-family="Arial, sans-serif" font-weight="extrabold" font-size="11" fill="#8b5cf6">PORTFOLIO ANALYTICS</text>

    <!-- 3D Bar Columns -->
    <g transform="translate(130, 200)">
      <rect x="0" y="-55" width="16" height="55" rx="4" fill="url(#purple-analytics)" className="anim-b1" />
      <rect x="24" y="-75" width="16" height="75" rx="4" fill="url(#cyan-analytics)" className="anim-b2" />
      <rect x="48" y="-40" width="16" height="40" rx="4" fill="url(#emerald-analytics)" className="anim-b3" />
      <rect x="72" y="-90" width="16" height="90" rx="4" fill="url(#purple-analytics)" className="anim-b2" />
      <rect x="96" y="-60" width="16" height="60" rx="4" fill="url(#cyan-analytics)" className="anim-b1" />
    </g>

    <!-- Trend Arrow Line Overlay -->
    <path d="M 130 155 Q 165 120 180 140 T 255 110" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="255,103 263,113 250,113" fill="#10b981" />
  </g>

  <!-- Side Floating Donut Pie Chart -->
  <g className="anim-analytics" transform="translate(275, 115)" filter="url(#shadow-analytics)">
    <g className="anim-pie">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-dasharray="70 40" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="35 75" stroke-dashoffset="-70" />
    </g>
    <circle cx="0" cy="0" r="14" fill="#181825" />
  </g>

  <!-- Floating Analytics Node (Left) -->
  <g className="anim-analytics" transform="translate(85, 130)" filter="url(#shadow-analytics)">
    <circle cx="16" cy="16" r="16" fill="url(#purple-analytics)" />
    <path d="M 11 21 L 15 16 L 18 18 L 22 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
