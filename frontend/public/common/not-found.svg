<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" fill="none" width="100%" height="100%">
  <defs>
    <!-- Rich Background & Glow Gradients -->
    <radialGradient id="nf-radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="nf-vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <linearGradient id="nf-banner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="nf-digit4a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="nf-digit0-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="nf-digit4b-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="nf-lens-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="nf-deep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="nf-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes float-main-card {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.2deg); }
      }
      @keyframes float-badge-4a {
        0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
        50% { transform: translateY(-18px) scale(1.08) rotate(-4deg); }
      }
      @keyframes float-badge-0 {
        0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
        50% { transform: translateY(-10px) scale(1.06) rotate(6deg); }
      }
      @keyframes float-badge-4b {
        0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
        50% { transform: translateY(-16px) scale(1.08) rotate(-3deg); }
      }
      @keyframes radar-pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes rotate-dashed-ring {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-inner-ring {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes shimmer-lens {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      @keyframes float-coin {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.1); }
      }

      .animated-nf-main { animation: float-main-card 5.2s ease-in-out infinite; transform-origin: center; }
      .animated-nf-badge4a { animation: float-badge-4a 3.9s ease-in-out infinite; transform-origin: center; }
      .animated-nf-badge0 { animation: float-badge-0 4.6s ease-in-out infinite 0.3s; transform-origin: center; }
      .animated-nf-badge4b { animation: float-badge-4b 4.2s ease-in-out infinite 0.6s; transform-origin: center; }
      .animated-nf-radar { animation: radar-pulse-glow 4s ease-in-out infinite; transform-origin: center; }
      .animated-nf-ring-outer { animation: rotate-dashed-ring 32s linear infinite; transform-origin: 220px 160px; }
      .animated-nf-ring-inner { animation: rotate-inner-ring 24s linear infinite; transform-origin: 220px 160px; }
      .animated-shimmer-lens { animation: shimmer-lens 3s ease-in-out infinite; transform-origin: center; }
      .animated-nf-coin { animation: float-coin 3.6s ease-in-out infinite 0.4s; transform-origin: center; }
    </style>
  </defs>

  <!-- Glowing Radar Core Background -->
  <circle cx="220" cy="160" r="140" fill="url(#nf-radial-glow)" className="animated-nf-radar" />

  <!-- Dual Counter-Rotating Dashed Radar Rings -->
  <g className="animated-nf-ring-outer">
    <circle cx="220" cy="160" r="125" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-dasharray="12 10" />
  </g>
  <g className="animated-nf-ring-inner">
    <circle cx="220" cy="160" r="95" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- Background Financial Grid Lines -->
  <g opacity="0.14">
    <line x1="50" y1="240" x2="390" y2="240" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="50" y1="190" x2="390" y2="190" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="50" y1="140" x2="390" y2="140" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Central Multi-Layered Glass Map Card -->
  <g className="animated-nf-main" filter="url(#nf-deep-shadow)">
    <!-- Base Shadow Offset Card -->
    <rect x="122" y="97" width="196" height="136" rx="24" fill="#0f0f17" opacity="0.6" />

    <!-- Main Card Vault Body -->
    <rect x="115" y="90" width="210" height="142" rx="24" fill="url(#nf-vault-grad)" stroke="#313244" stroke-width="2.5" />
    
    <!-- Top Card Header Banner -->
    <path d="M 115 114 C 115 100.7 125.7 90 139 90 L 301 90 C 314.3 90 325 100.7 325 114 L 325 128 L 115 128 Z" fill="url(#nf-banner-grad)" />

    <!-- Header Dots -->
    <circle cx="137" cy="109" r="4.5" fill="#f38ba8" />
    <circle cx="151" cy="109" r="4.5" fill="#f9e2af" />
    <circle cx="165" cy="109" r="4.5" fill="#a6e3a1" />

    <!-- Header Status Pill -->
    <rect x="235" y="101" width="72" height="16" rx="8" fill="#ffffff" opacity="0.2" />
    <text x="271" y="112.5" font-family="system-ui, sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" text-anchor="middle">RECORD MISSING</text>

    <!-- Magnifying Lens / Lost Compass Engine -->
    <g transform="translate(220, 175)">
      <!-- Outer Pulsing Lens Shield -->
      <circle cx="0" cy="0" r="32" fill="#181825" stroke="url(#nf-banner-grad)" stroke-width="3" />
      <circle cx="0" cy="0" r="26" fill="url(#nf-lens-beam)" className="animated-shimmer-lens" />

      <!-- Magnifying Glass Needle Handle -->
      <path d="M -10 10 L 10 -10 M 10 -10 H 2 M 10 -10 V -2" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Dotted Missing Record Placeholders -->
    <rect x="135" y="145" width="45" height="7" rx="3.5" fill="#24273a" />
    <rect x="135" y="158" width="30" height="7" rx="3.5" fill="#24273a" />

    <rect x="260" y="145" width="45" height="7" rx="3.5" fill="#24273a" />
    <rect x="275" y="158" width="30" height="7" rx="3.5" fill="#24273a" />
  </g>

  <!-- Orbiting 3D "4" - "0" - "4" Badges -->

  <!-- Left '4' Digit Badge -->
  <g className="animated-nf-badge4a" transform="translate(60, 75)" filter="url(#nf-deep-shadow)">
    <rect x="0" y="0" width="52" height="52" rx="16" fill="url(#nf-digit4a-grad)" stroke="#a5b4fc" stroke-width="1.5" />
    <text x="26" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- Center '0' Orbit Badge -->
  <g className="animated-nf-badge0" transform="translate(194, 38)" filter="url(#nf-deep-shadow)">
    <circle cx="26" cy="26" r="26" fill="url(#nf-digit0-grad)" stroke="#fde047" stroke-width="1.5" />
    <circle cx="26" cy="26" r="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <text x="26" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">0</text>
  </g>

  <!-- Right '4' Digit Badge -->
  <g className="animated-nf-badge4b" transform="translate(325, 80)" filter="url(#nf-deep-shadow)">
    <rect x="0" y="0" width="52" height="52" rx="16" fill="url(#nf-digit4b-grad)" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="26" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- Floating Currency Coin Badge (₹) -->
  <g className="animated-nf-coin" transform="translate(70, 205)" filter="url(#nf-deep-shadow)">
    <circle cx="18" cy="18" r="18" fill="url(#nf-digit0-grad)" />
    <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">₹</text>
  </g>

  <!-- Sparkles & Stars -->
  <g transform="translate(340, 200)">
    <path d="M 12 0 L 15 8 L 23 11 L 15 14 L 12 22 L 9 14 L 1 11 L 9 8 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(100, 45)">
    <path d="M 8 0 L 10 5 L 15 7 L 10 9 L 8 14 L 6 9 L 1 7 L 6 5 Z" fill="#f59e0b" />
  </g>
</svg>
