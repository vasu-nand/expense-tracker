<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" fill="none" width="100%" height="100%">
  <defs>
    <!-- Amber & Gold Glow Gradients -->
    <radialGradient id="maint-radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="maint-vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <linearGradient id="maint-amber-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="maint-cyan-gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="maint-emerald-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="maint-deep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <style>
      @keyframes float-maint-card {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.2deg); }
      }
      @keyframes spin-gear-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-gear-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes amber-pulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes swing-wrench {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-18deg); }
      }
      @keyframes rotate-dashed-maint {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float-tool-badge {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-16px) scale(1.08); }
      }

      .animated-maint-card { animation: float-maint-card 5.2s ease-in-out infinite; transform-origin: center; }
      .animated-gear-cw { animation: spin-gear-cw 12s linear infinite; transform-origin: center; }
      .animated-gear-ccw { animation: spin-gear-ccw 9s linear infinite; transform-origin: center; }
      .animated-maint-glow { animation: amber-pulse 3.8s ease-in-out infinite; transform-origin: center; }
      .animated-wrench-swing { animation: swing-wrench 3.2s ease-in-out infinite; transform-origin: center; }
      .animated-maint-ring { animation: rotate-dashed-maint 32s linear infinite; transform-origin: 220px 160px; }
      .animated-tool-badge { animation: float-tool-badge 4s ease-in-out infinite 0.4s; transform-origin: center; }
    </style>
  </defs>

  <!-- Amber Core Glow -->
  <circle cx="220" cy="160" r="140" fill="url(#maint-radial-glow)" className="animated-maint-glow" />

  <!-- Dual Counter-Rotating Gear Rings -->
  <g className="animated-maint-ring">
    <circle cx="220" cy="160" r="125" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-dasharray="14 10" />
    <circle cx="220" cy="160" r="95" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" fill="none" stroke-dasharray="8 6" />
  </g>

  <!-- Grid lines -->
  <g opacity="0.14">
    <line x1="50" y1="240" x2="390" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="50" y1="190" x2="390" y2="190" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="50" y1="140" x2="390" y2="140" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Central Maintenance Engine Vault Card -->
  <g className="animated-maint-card" filter="url(#maint-deep-shadow)">
    <!-- Base Shadow Card -->
    <rect x="122" y="97" width="196" height="136" rx="24" fill="#0f0f17" opacity="0.6" />

    <!-- Main Card Body -->
    <rect x="115" y="90" width="210" height="142" rx="24" fill="url(#maint-vault-grad)" stroke="#313244" stroke-width="2.5" />
    
    <!-- Top Header Banner -->
    <path d="M 115 114 C 115 100.7 125.7 90 139 90 L 301 90 C 314.3 90 325 100.7 325 114 L 325 128 L 115 128 Z" fill="url(#maint-amber-banner)" />

    <!-- Header Dots -->
    <circle cx="137" cy="109" r="4.5" fill="#ffffff" opacity="0.9" />
    <circle cx="151" cy="109" r="4.5" fill="#ffffff" opacity="0.6" />
    <circle cx="165" cy="109" r="4.5" fill="#ffffff" opacity="0.4" />
    
    <!-- Status Pill -->
    <rect x="225" y="101" width="82" height="16" rx="8" fill="#ffffff" opacity="0.2" />
    <text x="266" y="112.5" font-family="system-ui, sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" text-anchor="middle">UPGRADING CORE</text>

    <!-- Interlocking Spinning Gear System -->

    <!-- Primary Gear (Large Clockwise Amber) -->
    <g transform="translate(185, 175)">
      <g className="animated-gear-cw">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="7" stroke-dasharray="10 8" />
        <circle cx="0" cy="0" r="16" fill="#181825" stroke="#f59e0b" stroke-width="2.5" />
        <circle cx="0" cy="0" r="7" fill="#ffffff" />
      </g>
    </g>

    <!-- Secondary Gear (Medium Counter-Clockwise Cyan) -->
    <g transform="translate(240, 150)">
      <g className="animated-gear-ccw">
        <circle cx="0" cy="0" r="20" fill="none" stroke="#06b6d4" stroke-width="6" stroke-dasharray="8 6" />
        <circle cx="0" cy="0" r="11" fill="#181825" stroke="#06b6d4" stroke-width="2" />
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
      </g>
    </g>

    <!-- Wrench Tool Overlay -->
    <g transform="translate(260, 185)">
      <g className="animated-wrench-swing">
        <path d="M -16 -16 L 12 12 M -12 -20 C -20 -12 -12 -4 -4 -12 Z" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- System Status Lines -->
    <rect x="135" y="145" width="40" height="6" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="135" y="157" width="25" height="6" rx="3" fill="#f59e0b" opacity="0.5" />
  </g>

  <!-- Top-Left Floating "UPGRADE SYNC" Badge -->
  <g className="animated-tool-badge" transform="translate(58, 68)" filter="url(#maint-deep-shadow)">
    <rect x="0" y="0" width="82" height="38" rx="14" fill="url(#maint-amber-banner)" stroke="#fde047" stroke-width="1.5" />
    <text x="41" y="18" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">MAINTENANCE</text>
    <text x="41" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="8.5" fill="#fef3c7" text-anchor="middle">DATABASE SYNC</text>
  </g>

  <!-- Right Floating "ONLINE READY" Badge -->
  <g className="animated-tool-badge" transform="translate(325, 145)" filter="url(#maint-deep-shadow)">
    <rect x="0" y="0" width="75" height="38" rx="14" fill="url(#maint-emerald-pill)" stroke="#6ee7b7" stroke-width="1.5" />
    <text x="37.5" y="18" font-family="system-ui, sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">STATUS OK</text>
    <text x="37.5" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#d1fae5" text-anchor="middle">SERVER ACTIVE</text>
  </g>

  <!-- Sparkles -->
  <g transform="translate(90, 205)">
    <path d="M 10 0 L 13 6 L 19 8 L 13 10 L 10 16 L 7 10 L 1 8 L 7 6 Z" fill="#f59e0b" />
  </g>
</svg>
